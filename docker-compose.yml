version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: careloop
      POSTGRES_USER: careloop
      POSTGRES_PASSWORD: careloop_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: careloop
      MINIO_ROOT_PASSWORD: careloop_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  document-service:
    build: ./services/document-service
    ports:
      - "8001:8001"
    environment:
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - postgres
      - minio

  document-intelligence:
    build: ./services/document-intelligence
    ports:
      - "8002:8002"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  patient-state:
    build: ./services/patient-state
    ports:
      - "8003:8003"
    depends_on:
      - postgres

  care-gap-agent:
    build: ./services/care-gap-agent
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  evidence-agent:
    build: ./services/evidence-agent
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  action-agent:
    build: ./services/action-agent
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

volumes:
  postgres_data:
  minio_data:
  ollama_data: